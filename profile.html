    <main>
        <section class="profile-page" style="padding: 4rem 0; background-color: var(--clr-background); min-height: 70vh;">
            <div class="container">
                <div style="display: flex; flex-wrap: wrap; gap: 3rem; align-items: flex-start;">
                    
                    <div class="profile-sidebar" style="flex: 1 1 250px; background: white; border-radius: 16px; padding: 2.5rem 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center;">
                        <div style="width: 90px; height: 90px; background: var(--clr-primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 700; margin: 0 auto 1.5rem;">M</div>
                        <h3 style="margin-bottom: 0.5rem; font-size: 1.3rem;">Maria Silva</h3>
                        <p style="color: #666; font-size: 0.95rem; margin-bottom: 2.5rem;">maria.silva@email.com</p>
                        
                        <ul style="list-style: none; padding: 0; text-align: left; border-top: 1px solid #eee; padding-top: 1.5rem;">
                            <li style="margin-bottom: 1.5rem;"><a href="profile.html" style="color: var(--clr-primary); font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 0.8rem;"><span>👤</span> Meus Dados</a></li>
                            <li style="margin-bottom: 1.5rem;"><a href="orders.html" style="color: #555; text-decoration: none; display: flex; align-items: center; gap: 0.8rem; font-weight: 500;"><span>📦</span> Meus Pedidos</a></li>
                            <li style="margin-bottom: 1.5rem;"><a href="#" style="color: #555; text-decoration: none; display: flex; align-items: center; gap: 0.8rem; font-weight: 500;"><span>📍</span> Endereços</a></li>
                            <li><a href="#" style="color: #e74c3c; text-decoration: none; display: flex; align-items: center; gap: 0.8rem; font-weight: 500;"><span>🚪</span> Sair da conta</a></li>
                        </ul>
                    </div>
                    
                    <div class="profile-content" style="flex: 3 1 500px; background: white; border-radius: 16px; padding: 3rem; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
                        <h2 style="margin-bottom: 2.5rem; color: var(--clr-text-primary);">Dados Pessoais</h2>
                        
                        <form id="profileForm">
                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 1.5rem;">
                                <div>
                                    <label style="display: block; font-weight: 500; margin-bottom: 0.5rem; color: #444;">Nome Completo</label>
                                    <input type="text" value="Maria Silva" required style="width: 100%; padding: 1rem; border: 1px solid #ddd; border-radius: 8px;">
                                </div>
                                <div>
                                    <label style="display: block; font-weight: 500; margin-bottom: 0.5rem; color: #444;">CPF</label>
                                    <input type="text" value="123.456.789-00" style="width: 100%; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; background: #f9f9f9;" disabled>
                                </div>
                            </div>
                            
                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem;">
                                <div>
                                    <label style="display: block; font-weight: 500; margin-bottom: 0.5rem; color: #444;">E-mail</label>
                                    <input type="email" value="maria.silva@email.com" required style="width: 100%; padding: 1rem; border: 1px solid #ddd; border-radius: 8px;">
                                </div>
                                <div>
                                    <label style="display: block; font-weight: 500; margin-bottom: 0.5rem; color: #444;">Telefone</label>
                                    <input type="tel" value="(11) 98765-4321" required style="width: 100%; padding: 1rem; border: 1px solid #ddd; border-radius: 8px;">
                                </div>
                            </div>
                            
                            <button type="button" onclick="alert('Dados atualizados com sucesso!')" class="btn btn-primary" style="border-radius: 50px; padding: 1rem 2.5rem; font-size: 1.05rem;">Salvar Alterações</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>
